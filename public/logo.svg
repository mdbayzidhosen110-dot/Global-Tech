<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8517a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f4874b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5c518;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Network globe icon -->
  <g transform="translate(10,10) scale(0.8)">
    <circle cx="50" cy="50" r="40" fill="none" stroke="url(#logoGrad)" stroke-width="4"/>
    <circle cx="50" cy="50" r="6" fill="url(#logoGrad)"/>
    <line x1="50" y1="50" x2="20" y2="30" stroke="url(#logoGrad)" stroke-width="3"/>
    <line x1="50" y1="50" x2="80" y2="30" stroke="url(#logoGrad)" stroke-width="3"/>
    <line x1="50" y1="50" x2="85" y2="60" stroke="url(#logoGrad)" stroke-width="3"/>
    <line x1="50" y1="50" x2="60" y2="85" stroke="url(#logoGrad)" stroke-width="3"/>
    <line x1="50" y1="50" x2="20" y2="70" stroke="url(#logoGrad)" stroke-width="3"/>
    <circle cx="20" cy="30" r="5" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
    <circle cx="80" cy="30" r="5" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
    <circle cx="85" cy="60" r="5" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
    <circle cx="60" cy="85" r="5" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
    <circle cx="20" cy="70" r="5" fill="none" stroke="url(#logoGrad)" stroke-width="3"/>
  </g>
  <!-- GLOBALTECH text -->
  <text x="100" y="58" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="32" fill="#1a1a2e">GLOBAL</text>
  <text x="230" y="58" font-family="'Segoe UI', Arial, sans-serif" font-weight="300" font-size="32" fill="#1a1a2e">TECH</text>
</svg>
